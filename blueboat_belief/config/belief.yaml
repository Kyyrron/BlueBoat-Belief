# BlueBoat-Belief node parameters (ROS 2 parameter file; flat names section.key).
# Defaults = core/config.py. Every number is a cited value or a labelled PLACEHOLDER
# (docs/MATH.md §0). area.file is set by the launch file (area_file:=...).
# alignment.origin_lat/lon (override: GPS of odom (0,0)) default to NaN = unset and are
# omitted here; set both to use the override.
# PRIORITY: detector.calibrated stays false until Perception ships a calibrated detector.
belief_map:
  ros__parameters:
    grid:
      resolution_m: 0.5
    aspect:
      sector_count: 12
      origin_deg: 0.0
    look:
      timeout_s: 20.0
      time_reset_s: 5.0
    prior:
      density_per_ha: 5.0
      exact_poisson: false
    detector:
      base_rate: 0.5
      calibrated: false
      class_names: ["block", "pipe", "cage", "tyre", "plate", "other"]
      ignore_classes: ["dummy_center"]
    clamp:
      p_min: 1.0e-05
      p_max: 0.999
    pd:
      plateau: 0.7
      r_lo_m: 3.0
      r_hi_m: 25.0
      ramp_m: 3.0
      pfa: 0.0
      lever_arm_m: 0.285
    rho:
      independence_angle_deg: 90.0
      fold_opposite: true
      ordering: "paull_pairwise"
    association:
      gate_m: 2.0
      chi2: 9.21
    contact:
      position_floor_sigma_m: 0.5
      common_mode_sigma_m: 1.0
      min_indep_sigma_m: 0.05
      prune_p: 0.001
      max_contacts: 500
      confirm_looks: 2
      confirm_distinct_sectors: false
      dirichlet_alpha0: 1.0
    uncertainty:
      sigma_pose_m: 1.0
      sigma_yaw_deg: 2.0
      sigma_along_m: 0.3
      sigma_across_m: 0.2
      across_per_range: 0.01
    pose:
      stamp_tolerance_s: 0.25
      frozen_count: 20
      buffer_s: 30.0
    ping:
      unknown_water_depth_m: 0.22
      unknown_tol_m: 0.0001
    alignment:
      window: 200
      min_pairs: 10
      max_spread_m: 3.0
      latch: true
      override_sigma_m: 1.0
      queue_max: 6000
      sim_check_m: 0.5
    coverage:
      require_detector: true
      max_array_gap_s: 30.0
      wait_s: 60.0
    turn:
      enabled: true
      window_s: 1.0
      min_speed_mps: 0.05
      min_yaw_rate_rad_s: 0.01
    publish:
      grid_rate_hz: 1.0
      display_rate_hz: 0.5
    snapshot:
      period_s: 60.0
    io:
      data_dir: ""
